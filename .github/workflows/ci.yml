# 작성 규칙은 docs/ci.md 참고
# - job 이름(verify)은 main 규칙의 필수 체크 이름이다. 바꾸면 GitHub 규칙도 같이 바꾼다.
# - 액션은 커밋 SHA 로 고정하고 옆에 버전을 적는다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # pnpm 버전은 package.json 의 packageManager 를 따른다
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      - name: 생성 파일이 커밋됐는지 확인
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::pnpm verify 가 파일을 바꿨습니다 (예: src/routeTree.gen.ts). 로컬에서 pnpm check 를 돌리고 바뀐 파일을 커밋하세요."
            exit 1
          fi
